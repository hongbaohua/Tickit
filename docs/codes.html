<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代碼練習 · Tickit</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .seg { display:flex; gap:0.4rem; flex-wrap:wrap; }
    .seg label {
      display:flex; align-items:center; gap:0.35rem; cursor:pointer;
      font-size:0.85rem; padding:0.45rem 0.8rem; border:1.5px solid #E5E7EB;
      border-radius:8px; background:white; transition:border-color .15s, background .15s;
    }
    .seg label.on { border-color:#6366F1; background:#EEF2FF; color:#3730A3; font-weight:600; }
    .seg input { accent-color:#4F46E5; }
    .mode-desc { font-size:0.76rem; color:#6B7280; margin-top:0.55rem; line-height:1.6; }

    .cat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:0.45rem; }
    .cat-item {
      display:flex; align-items:center; gap:0.45rem; padding:0.55rem 0.7rem;
      border:1.5px solid #E5E7EB; border-radius:8px; cursor:pointer; font-size:0.84rem; background:white;
    }
    .cat-item.on { border-color:#6366F1; background:#EEF2FF; }
    .cat-item input { accent-color:#4F46E5; }
    .cat-item .cnt { margin-left:auto; font-size:0.72rem; color:#9CA3AF; }
    .cat-item .wrong { font-size:0.68rem; color:#DC2626; font-weight:700; }

    .prompt-card { text-align:center; padding:2rem 1.5rem 1.6rem; }
    .prompt-dir { font-size:0.74rem; font-weight:700; color:#6366F1; letter-spacing:1px; }
    .prompt-cat { font-size:0.72rem; color:#9CA3AF; margin-top:0.2rem; }
    .prompt-main {
      font-size:2.6rem; font-weight:800; color:#111827; margin:0.9rem 0 1.2rem;
      letter-spacing:2px; word-break:break-all; line-height:1.2;
    }
    .prompt-main.zh { font-size:1.9rem; letter-spacing:1px; }
    .prompt-sub { font-size:0.76rem; color:#D97706; margin:-0.6rem 0 1rem; }
    #answer-input { font-size:1.15rem; text-align:center; padding:0.75rem; }
    #answer-input.ok  { border-color:#10B981; background:#ECFDF5; }
    #answer-input.bad { border-color:#EF4444; background:#FEF2F2; }

    .feedback { margin-top:1rem; border-radius:8px; padding:0.85rem 1rem; text-align:left; font-size:0.86rem; line-height:1.7; }
    .feedback.ok  { background:#ECFDF5; border:1px solid #A7F3D0; color:#065F46; }
    .feedback.bad { background:#FEF2F2; border:1px solid #FECACA; color:#991B1B; }
    .feedback .ans { font-size:1.15rem; font-weight:800; }
    .feedback .mn  { color:#374151; margin-top:0.35rem; }
    .feedback .note{ color:#6B7280; font-size:0.76rem; margin-top:0.25rem; }
    .link-btn { border:none; background:none; color:#6366F1; font-size:0.76rem; cursor:pointer; padding:0; text-decoration:underline; margin-top:0.4rem; }

    .stat-row { display:flex; gap:0.5rem; justify-content:space-between; font-size:0.76rem; color:#6B7280; margin-bottom:0.45rem; flex-wrap:wrap; }
    .stat-row b { color:#111827; }

    .flash { cursor:pointer; min-height:220px; display:flex; flex-direction:column; justify-content:center; user-select:none; }
    .flash .back { margin-top:0.6rem; }
    .flash .back .ans { font-size:1.6rem; font-weight:800; color:#4F46E5; }
    .flash .back .mn  { font-size:0.86rem; color:#374151; margin-top:0.6rem; line-height:1.7; }
    .flash .tap { font-size:0.74rem; color:#9CA3AF; margin-top:1rem; }

    table.ref { width:100%; border-collapse:collapse; font-size:0.8rem; }
    table.ref th, table.ref td { padding:0.45rem 0.4rem; border-bottom:1px solid #F1F5F9; text-align:left; vertical-align:top; }
    table.ref th { font-size:0.7rem; color:#9CA3AF; font-weight:600; }
    table.ref td.code { font-weight:800; font-family:ui-monospace,Consolas,monospace; color:#4F46E5; white-space:nowrap; }
    table.ref td.mn { color:#6B7280; font-size:0.74rem; }
    .ref-cat { font-size:0.82rem; font-weight:700; color:#111827; margin:1.1rem 0 0.3rem; }
    .ref-cat:first-child { margin-top:0; }
    .focus-toggle {
      display:flex; align-items:center; gap:0.5rem; margin-top:0.75rem; padding:0.6rem 0.8rem;
      border:1.5px dashed #FCD34D; border-radius:8px; background:#FFFBEB; cursor:pointer; font-size:0.84rem; color:#92400E;
    }
    .focus-toggle.on { border-style:solid; border-color:#F59E0B; background:#FEF3C7; font-weight:600; }
    .focus-toggle input { accent-color:#D97706; }
    .prod-tag { display:inline-block; background:#FEF3C7; color:#92400E; border:1px solid #FDE68A; font-size:0.72rem; font-weight:600; border-radius:5px; padding:1px 7px; margin-top:0.35rem; }
    .wrong-pill { display:inline-block; background:#FEF2F2; color:#DC2626; font-size:0.66rem; font-weight:700; border-radius:4px; padding:0 5px; margin-left:4px; }

    .result-list .row { display:flex; gap:0.8rem; padding:0.55rem 0; border-bottom:1px solid #F1F5F9; font-size:0.84rem; align-items:baseline; }
    .result-list .q { font-weight:700; min-width:5.5rem; }
    .result-list .you { color:#DC2626; text-decoration:line-through; font-size:0.78rem; }
    .result-list .right { color:#059669; font-weight:700; }
    .result-list .mn { color:#6B7280; font-size:0.74rem; }
    @media (max-width: 600px) { .prompt-main { font-size:2.1rem; } }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-icon"></div>
      <span class="sidebar-title">Tickit</span>
    </div>
    <nav>
      <a href="index.html" class="nav-link"><span class="nav-dot"></span>首頁</a>
      <a href="codes.html" class="nav-link active"><span class="nav-dot"></span>代碼練習</a>
      <a href="dashboard.html" class="nav-link"><span class="nav-dot"></span>考生管理</a>
    </nav>
  </aside>

  <main class="main">

    <!-- ── Setup ── -->
    <div id="view-setup">
      <div class="user-bar">
        <div class="user-info">
          <div class="user-avatar" id="avatar-letter">U</div>
          <div>
            <div class="user-name" id="display-name">—</div>
            <div class="user-label">機場／航空代碼練習</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="location.href='index.html'">← 首頁</button>
      </div>

      <div class="card">
        <div class="step-header"><span class="step-badge">01</span>範圍</div>
        <div class="select-all-row">
          <button class="btn btn-ghost btn-sm" id="btn-ref">📋 總表＋記憶法</button>
          <button class="btn btn-ghost btn-sm" id="btn-all-cats">全選</button>
        </div>
        <div class="cat-grid" id="cat-list"><div class="loading">載入中…</div></div>
        <label class="focus-toggle">
          <input type="checkbox" id="focus-only" />
          <span>★ 只練公司產品線相關的代碼 <span id="focus-n" style="font-weight:400;"></span></span>
        </label>
        <div class="unit-count" id="cat-count"></div>
      </div>

      <div class="card">
        <div class="step-header"><span class="step-badge">02</span>出題方向</div>
        <div class="seg">
          <label><input type="radio" name="dir" value="c2z" checked /> 看代碼 → 寫中文</label>
          <label><input type="radio" name="dir" value="z2c" /> 看中文 → 寫代碼</label>
          <label><input type="radio" name="dir" value="mix" /> 雙向混合</label>
        </div>
      </div>

      <div class="card">
        <div class="step-header"><span class="step-badge">03</span>練習方式</div>
        <div class="seg">
          <label><input type="radio" name="mode" value="flash" /> 記憶卡</label>
          <label><input type="radio" name="mode" value="mastery" checked /> 攻克模式</label>
          <label><input type="radio" name="mode" value="all" /> 全部測一輪</label>
          <label><input type="radio" name="mode" value="random" /> 隨機 N 題</label>
          <label><input type="radio" name="mode" value="wrong" /> 錯題攻克</label>
        </div>
        <div id="random-input" style="display:none;margin-top:0.6rem;">
          <input type="number" id="input-n" min="1" max="300" value="20" style="width:100px;" />
        </div>
        <div class="mode-desc" id="mode-desc"></div>
      </div>

      <button class="btn btn-primary btn-full" id="btn-start" disabled>開始練習 →</button>
      <p id="start-hint" style="text-align:center;font-size:0.76rem;color:#9CA3AF;margin-top:0.5rem;">請至少選一個範圍</p>
    </div>

    <!-- ── Reference table ── -->
    <div id="view-ref" style="display:none;">
      <div class="nav-row" style="margin-bottom:0.8rem;">
        <button class="btn btn-ghost btn-sm" onclick="showView('setup')">← 返回</button>
      </div>
      <div class="card" id="ref-body"></div>
    </div>

    <!-- ── Quiz ── -->
    <div id="view-quiz" style="display:none;">
      <div class="stat-row">
        <span id="stat-left"></span>
        <span id="stat-right"></span>
      </div>
      <div class="progress-bar-track" style="margin-bottom:0.9rem;"><div class="progress-bar-fill" id="progress"></div></div>

      <div class="card prompt-card">
        <div class="prompt-dir" id="q-dir"></div>
        <div class="prompt-cat" id="q-cat"></div>
        <div class="prompt-main" id="q-prompt"></div>
        <div class="prompt-sub" id="q-sub" style="display:none;"></div>
        <input type="text" id="answer-input" autocomplete="off" autocorrect="off" spellcheck="false" />
        <div id="feedback"></div>
        <button class="btn btn-primary btn-full" id="btn-submit" style="margin-top:0.9rem;">確認（Enter）</button>
      </div>
      <div style="display:flex;gap:0.5rem;">
        <button class="btn btn-ghost btn-sm" id="btn-skip">不會，看答案</button>
        <button class="btn btn-ghost btn-sm" id="btn-finish" style="margin-left:auto;">結束並看結果</button>
      </div>
    </div>

    <!-- ── Flash cards ── -->
    <div id="view-flash" style="display:none;">
      <div class="stat-row"><span id="flash-left"></span><span id="flash-right"></span></div>
      <div class="progress-bar-track" style="margin-bottom:0.9rem;"><div class="progress-bar-fill" id="flash-progress"></div></div>
      <div class="card prompt-card flash" id="flash-card">
        <div class="prompt-dir" id="f-dir"></div>
        <div class="prompt-cat" id="f-cat"></div>
        <div class="prompt-main" id="f-front" style="margin-bottom:0.2rem;"></div>
        <div class="back" id="f-back" style="display:none;"></div>
        <div class="tap" id="f-tap">點一下或按空白鍵翻面</div>
      </div>
      <div id="flash-actions" style="display:none;gap:0.5rem;">
        <button class="btn btn-ghost" style="flex:1;color:#DC2626;border-color:#FECACA;" id="btn-again">✗ 還不熟（J）</button>
        <button class="btn btn-primary" style="flex:1;" id="btn-know">✓ 記住了（K）</button>
      </div>
      <div style="margin-top:0.6rem;"><button class="btn btn-ghost btn-sm" onclick="showView('setup')">結束記憶卡</button></div>
    </div>

    <!-- ── Result ── -->
    <div id="view-result" style="display:none;">
      <div class="card score-card">
        <div style="font-size:0.8rem;color:#6B7280;margin-bottom:0.4rem;" id="r-title">首答成績</div>
        <div style="font-size:2.6rem;font-weight:800;" id="r-score"></div>
        <div style="font-size:0.95rem;font-weight:700;margin-top:0.2rem;" id="r-pct"></div>
        <div style="font-size:0.76rem;color:#9CA3AF;margin-top:0.6rem;" id="r-save"></div>
      </div>
      <div class="card" id="r-count-card">
        <div class="section-title" style="margin-bottom:0.2rem;">每題作答次數</div>
        <div style="font-size:0.74rem;color:#9CA3AF;margin-bottom:0.5rem;" id="r-count-sub"></div>
        <table class="ref" id="r-count"></table>
      </div>
      <div class="card" id="r-wrong-card">
        <div class="section-title" style="margin-bottom:0.5rem;">填錯答案回顧</div>
        <div class="result-list" id="r-wrong"></div>
      </div>
      <div style="display:flex;gap:0.5rem;">
        <button class="btn btn-primary" style="flex:1;" id="btn-retry-wrong">只攻克這次錯的 →</button>
        <button class="btn btn-ghost" style="flex:1;" onclick="showView('setup'); refreshWrongCounts();">回設定</button>
      </div>
    </div>

  </main>
</div>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/codes.js"></script>
<script>
  const user = JSON.parse(sessionStorage.getItem("quizUser") || "null");
  if (!user) location.href = "index.html";

  let bank = [];
  let wrongIds = new Set();
  const MODE_DESC = {
    flash: "翻卡背誦，看完答案自評「記住了／還不熟」，不熟的會再出現。不寫入紀錄。",
    mastery: "選取範圍全部循環：答錯的 4 題後會再出現，直到每題都答對。首答結果會存入紀錄。最推薦用來背。",
    all: "全部題目各出一次，即時顯示對錯，結束後存入紀錄。適合檢查背熟程度。",
    random: "隨機抽 N 題，即時顯示對錯，結束後存入紀錄。適合零碎時間快速複習。",
    wrong: "只出歷史上答錯過的題目，循環到全部答對為止。",
  };

  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
  function showToast(msg, ms = 2500) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), ms); }
  function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function showView(name) {
    ["setup", "ref", "quiz", "flash", "result"].forEach((v) =>
      document.getElementById(`view-${v}`).style.display = v === name ? "block" : "none");
    if (name === "flash") document.getElementById("flash-actions").style.display = "none";
    window.scrollTo(0, 0);
  }
  const EXTRA_CAT = "產品線補充"; // 考試題庫外、依公司產品補充的代碼，預設不勾
  // 選取狀態的外框：用 class 切換（部分手機瀏覽器的 :has() 不會即時更新）
  function syncChecked() {
    document.querySelectorAll(".seg label, .cat-item, .focus-toggle").forEach((l) => {
      const i = l.querySelector("input");
      if (i) l.classList.toggle("on", i.checked);
    });
  }
  document.addEventListener("change", syncChecked);
  const focusOnly = () => document.getElementById("focus-only").checked;
  const srcBank = () => (focusOnly() ? bank.filter((b) => b.company) : bank);
  const prodTag = (q) => {
    const ps = [...new Set(q.items.map((it) => it.product).filter(Boolean))];
    return ps.length ? `<div><span class="prod-tag">★ 公司產品線：${esc(ps.join("；"))}</span></div>` : "";
  };
  const selectedCats = () => [...document.querySelectorAll("#cat-list input:checked")].map((c) => c.value);
  const radio = (n) => document.querySelector(`input[name=${n}]:checked`).value;

  // ── Init ──
  (async function init() {
    document.getElementById("display-name").textContent = user.name;
    document.getElementById("avatar-letter").textContent = user.name[0].toUpperCase();
    try {
      bank = await loadCodeBank();
    } catch (e) {
      document.getElementById("cat-list").innerHTML = `<div style="color:#EF4444;font-size:0.82rem;">${esc(e.message)}</div>`;
      return;
    }
    const cats = [...new Set(bank.map((b) => b.category))];
    document.getElementById("cat-list").innerHTML = cats.map((c) => `
      <label class="cat-item">
        <input type="checkbox" value="${esc(c)}" ${c === EXTRA_CAT ? "" : "checked"} />
        <span>${esc(c)}${c === EXTRA_CAT ? '<div style="font-size:0.66rem;color:#B45309;">考試範圍外</div>' : ""}</span>
        <span class="wrong" data-wrong="${esc(c)}"></span>
        <span class="cnt">${bank.filter((b) => b.category === c).length}</span>
      </label>`).join("");
    document.querySelectorAll("#cat-list input").forEach((i) => i.addEventListener("change", updateSetup));
    document.getElementById("focus-only").addEventListener("change", updateSetup);
    updateSetup();
    updateModeDesc();
    syncChecked();
    refreshWrongCounts();
  })();

  async function refreshWrongCounts() {
    try {
      // 「曾經錯過」且最近一次作答仍錯 → 才算目前的錯題
      wrongIds = await getCurrentWrongCodeIds(user.id);
    } catch (e) {
      wrongIds = new Set();
      showToast("無法連線資料庫：錯題紀錄暫時無法讀取");
    }
    const byCat = {};
    for (const id of wrongIds) {
      const num = id.split("__").pop();
      const it = bank.find((b) => b.id === num);
      if (it) byCat[it.category] = (byCat[it.category] || 0) + 1;
    }
    document.querySelectorAll("[data-wrong]").forEach((el) => {
      const n = byCat[el.dataset.wrong];
      el.textContent = n ? `錯 ${n}` : "";
    });
  }

  function updateSetup() {
    const cats = selectedCats();
    const n = srcBank().filter((b) => cats.includes(b.category)).length;
    document.getElementById("focus-n").textContent = `（共 ${bank.filter((b) => b.company).length} 個）`;
    document.getElementById("cat-count").textContent = cats.length
      ? `已選 ${cats.length} 類，共 ${n} 個代碼${focusOnly() ? "（只含產品線相關）" : ""}` : "";
    document.getElementById("btn-start").disabled = !cats.length || !n;
    const hint = document.getElementById("start-hint");
    hint.textContent = !cats.length ? "請至少選一個範圍" : "選取的範圍裡沒有產品線相關的代碼";
    hint.style.display = cats.length && n ? "none" : "block";
    document.getElementById("btn-all-cats").textContent =
      document.querySelectorAll("#cat-list input:not(:checked)").length ? "全選" : "全不選";
  }
  document.getElementById("btn-all-cats").addEventListener("click", () => {
    const boxes = [...document.querySelectorAll("#cat-list input")];
    const all = boxes.every((b) => b.checked);
    boxes.forEach((b) => (b.checked = !all));
    updateSetup();
    syncChecked();
  });
  function updateModeDesc() {
    const m = radio("mode");
    document.getElementById("mode-desc").textContent = MODE_DESC[m];
    document.getElementById("random-input").style.display = m === "random" ? "block" : "none";
  }
  document.querySelectorAll("input[name=mode]").forEach((r) => r.addEventListener("change", updateModeDesc));

  // ── Reference table ──
  document.getElementById("btn-ref").addEventListener("click", () => {
    const cats = (selectedCats().length ? selectedCats() : [...new Set(bank.map((b) => b.category))])
      .filter((c) => srcBank().some((b) => b.category === c));
    const wrongNums = new Set([...wrongIds].map((id) => id.split("__").pop()));
    document.getElementById("ref-body").innerHTML = cats.map((c) => `
      <div class="ref-cat">${esc(c)}</div>
      <table class="ref">
        <thead><tr><th>代碼</th><th>中文</th><th>記憶法</th></tr></thead>
        <tbody>${srcBank().filter((b) => b.category === c).map((b) => `
          <tr><td class="code">${esc(b.code)}</td>
              <td>${b.company ? '<span title="公司產品線" style="color:#D97706;">★</span> ' : ""}${esc(b.zh)}${wrongNums.has(b.id) ? '<span class="wrong-pill">錯過</span>' : ""}${b.product ? `<div style="font-size:0.7rem;color:#B45309;">${esc(b.product)}</div>` : ""}</td>
              <td class="mn">${esc(b.mnemonic)}${b.note ? `<br><span style="color:#B45309;">※ ${esc(b.note)}</span>` : ""}</td></tr>`).join("")}
        </tbody>
      </table>`).join("");
    showView("ref");
  });

  // ── Build question list ──
  function buildQuestions(cats, dir) {
    const src = srcBank();
    if (dir !== "mix") return buildCodeQuestions(src, cats, dir);
    const c2z = buildCodeQuestions(src, cats, "c2z");
    const z2c = buildCodeQuestions(src, cats, "z2c");
    const used = new Set();
    const out = [];
    for (const q of c2z) {
      if (Math.random() < 0.5) { out.push(q); continue; }
      const g = z2c.find((z) => z.items.some((it) => it.id === q.items[0].id));
      if (!used.has(g.id)) { used.add(g.id); out.push(g); }
    }
    return out;
  }

  document.getElementById("btn-start").addEventListener("click", async () => {
    const cats = selectedCats();
    const dir = radio("dir");
    const mode = radio("mode");
    let qs;
    if (mode === "wrong") {
      await refreshWrongCounts();
      const all = [...buildCodeQuestions(srcBank(), cats, "c2z"), ...buildCodeQuestions(srcBank(), cats, "z2c")];
      qs = all.filter((q) => wrongIds.has(q.id) && (dir === "mix" || q.dir === dir));
      if (!qs.length) { showToast(dir === "mix" ? "這些範圍目前沒有錯題 🎉" : "這個方向目前沒有錯題，試試「雙向混合」"); return; }
    } else {
      qs = buildQuestions(cats, dir);
    }
    qs = shuffle(qs);
    if (mode === "random") qs = qs.slice(0, Math.max(1, parseInt(document.getElementById("input-n").value, 10) || 20));
    if (mode === "flash") return startFlash(qs);
    startQuiz(qs, mode === "mastery" || mode === "wrong", cats);
  });

  // ══════════ Quiz (typed answers) ══════════
  let Q = null; // quiz state

  function startQuiz(questions, loop, cats) {
    Q = {
      questions, loop, cats,
      queue: [...questions],
      first: new Map(),     // question.id → { ok, answer }
      mastered: new Set(),
      retries: 0,
      wrongCount: new Map(),   // question.id → 答錯次數
      wrongAnswers: new Map(), // question.id → 填錯的答案（依序）
      cur: null,
      answered: false,
      lastOk: false,
      saved: false,
    };
    showView("quiz");
    nextQuestion();
  }

  function nextQuestion() {
    if (!Q.queue.length) return finishQuiz();
    Q.cur = Q.queue.shift();
    Q.answered = false;
    const q = Q.cur;
    const isC2Z = q.dir === "c2z";
    document.getElementById("q-dir").textContent = isC2Z ? "看代碼 → 寫中文" : "看中文 → 寫代碼";
    const catLabel = q.unit === "特殊需求" ? "特殊需求（餐點／輪椅）" : q.unit;
    const isProd = q.items.some((it) => it.company);
    document.getElementById("q-cat").textContent = catLabel + (isProd ? "　★ 產品線" : "") + (Q.first.has(q.id) ? "　↩ 再練" : "");
    const p = document.getElementById("q-prompt");
    p.textContent = q.prompt;
    p.className = "prompt-main" + (isC2Z ? "" : " zh");
    const sub = document.getElementById("q-sub");
    if (!isC2Z && q.items.length > 1) {
      sub.textContent = `這個名稱有 ${q.items.length} 個代碼，寫出任一個即可`;
      sub.style.display = "block";
    } else sub.style.display = "none";

    const inp = document.getElementById("answer-input");
    inp.value = "";
    inp.className = "";
    inp.disabled = false;
    inp.placeholder = isC2Z ? "輸入中文（不限格式）" : "輸入代碼（大小寫皆可）";
    inp.setAttribute("autocapitalize", isC2Z ? "off" : "characters");
    inp.lang = isC2Z ? "zh-Hant" : "en";
    document.getElementById("feedback").innerHTML = "";
    document.getElementById("btn-submit").textContent = "確認（Enter）";
    document.getElementById("btn-skip").style.visibility = "visible";
    updateStats();
    inp.focus();
  }

  function updateStats() {
    const total = Q.questions.length;
    let done, left, right;
    if (Q.loop) {
      done = Q.mastered.size;
      left = `已攻克 <b>${done}</b> / ${total}`;
      right = `答錯重練 <b>${Q.retries}</b> 次`;
    } else {
      done = Q.first.size;
      const ok = [...Q.first.values()].filter((v) => v.ok).length;
      left = `第 <b>${Math.min(done + (Q.answered ? 0 : 1), total)}</b> / ${total} 題`;
      right = `答對 <b>${ok}</b>`;
    }
    document.getElementById("stat-left").innerHTML = left;
    document.getElementById("stat-right").innerHTML = right;
    document.getElementById("progress").style.width = `${(done / total) * 100}%`;
  }

  function submitAnswer(skip = false) {
    if (Q.answered) return nextQuestion();
    const inp = document.getElementById("answer-input");
    const raw = skip ? "" : inp.value;
    if (!skip && !raw.trim()) { inp.focus(); return; }
    const { ok, hint } = judgeCodeAnswer(Q.cur, raw);
    Q.answered = true;
    record(ok, raw);
    inp.disabled = true;
    inp.className = ok ? "ok" : "bad";
    renderFeedback(ok, hint, raw);
    document.getElementById("btn-submit").textContent = "下一題（Enter）";
    document.getElementById("btn-skip").style.visibility = "hidden";
    updateStats();
    document.getElementById("btn-submit").focus();
  }

  function record(ok, raw) {
    const q = Q.cur;
    if (!Q.first.has(q.id)) Q.first.set(q.id, { ok, answer: raw });
    Q.lastOk = ok;
    if (!ok) {
      Q.wrongCount.set(q.id, (Q.wrongCount.get(q.id) || 0) + 1);
      if (!Q.wrongAnswers.has(q.id)) Q.wrongAnswers.set(q.id, []);
      Q.wrongAnswers.get(q.id).push(raw.trim() || "（不會，看答案）");
    }
    if (!Q.loop) return;
    if (ok) Q.mastered.add(q.id);
    else {
      Q.retries++;
      Q.queue.splice(Math.min(4, Q.queue.length), 0, q);
    }
  }

  // 判定有誤 → 改判為正確
  function overrideCorrect() {
    const q = Q.cur;
    const f = Q.first.get(q.id);
    if (f && !f.ok && f.answer === document.getElementById("answer-input").value) f.ok = true;
    if (!Q.lastOk) {
      const n = (Q.wrongCount.get(q.id) || 1) - 1;
      if (n > 0) Q.wrongCount.set(q.id, n); else Q.wrongCount.delete(q.id);
      const wa = Q.wrongAnswers.get(q.id);
      if (wa) { wa.pop(); if (!wa.length) Q.wrongAnswers.delete(q.id); }
    }
    if (Q.loop && !Q.lastOk) {
      Q.retries--;
      const idx = Q.queue.lastIndexOf(q);
      if (idx >= 0) Q.queue.splice(idx, 1);
      Q.mastered.add(q.id);
    }
    Q.lastOk = true;
    document.getElementById("answer-input").className = "ok";
    renderFeedback(true, "", "", true);
    updateStats();
    document.getElementById("btn-submit").focus();
  }

  function renderFeedback(ok, hint, raw, overridden = false) {
    const q = Q.cur;
    const mn = q.items.map((it) => (q.items.length > 1 ? `<b>${esc(it.code)}</b>：` : "") + esc(it.mnemonic)).join("<br>");
    const notes = [...new Set(q.items.map((it) => it.note).filter(Boolean))].map((n) => `<div class="note">※ ${esc(n)}</div>`).join("");
    const answerLine = q.dir === "z2c"
      ? `${esc(q.prompt)} ＝ <span class="ans">${esc(codeAnswerText(q))}</span>`
      : `${esc(q.prompt)} ＝ <span class="ans">${esc(codeAnswerText(q))}</span>`;
    const head = ok
      ? `✓ ${overridden ? "已改判為正確" : "正確"}`
      : (raw.trim() ? `✗ 不對${hint ? `：${esc(hint)}` : ""}` : "答案");
    const override = !ok && raw.trim() && q.dir === "c2z"
      ? `<button class="link-btn" onclick="overrideCorrect()">我寫的意思其實是對的，算我對</button>` : "";
    document.getElementById("feedback").innerHTML = `
      <div class="feedback ${ok ? "ok" : "bad"}">
        <div style="font-weight:700;">${head}</div>
        <div>${answerLine}</div>
        <div class="mn">💡 ${mn}</div>
        ${prodTag(q)}
        ${notes}
        ${override}
      </div>`;
  }

  document.getElementById("btn-submit").addEventListener("click", () => submitAnswer());
  document.getElementById("btn-skip").addEventListener("click", () => submitAnswer(true));
  document.getElementById("answer-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submitAnswer(); }
  });
  document.getElementById("btn-finish").addEventListener("click", () => {
    if (!Q.first.size) { showView("setup"); return; }
    finishQuiz();
  });

  async function finishQuiz() {
    const answered = Q.questions.filter((q) => Q.first.has(q.id));
    const total = answered.length;
    const correct = answered.filter((q) => Q.first.get(q.id).ok).length;
    const wrong = answered.filter((q) => !Q.first.get(q.id).ok);
    Q.lastWrong = wrong;

    const titleEl = document.getElementById("r-title");
    const pct = total ? Math.round((correct / total) * 100) : 0;
    if (Q.loop && Q.queue.length) {
      titleEl.textContent = `首答成績（中途結束，已攻克 ${Q.mastered.size} / ${Q.questions.length} 題）`;
    } else if (Q.loop) {
      titleEl.textContent = `首答成績（共重練 ${Q.retries} 次）`;
    } else {
      titleEl.textContent = "成績";
    }

    // 每題作答次數（攻克模式）：答錯次數多的排前面
    const countCard = document.getElementById("r-count-card");
    countCard.style.display = Q.loop ? "block" : "none";
    if (Q.loop) {
      const rows = answered.map((q) => {
        const wrongN = Q.wrongCount.get(q.id) || 0;
        const done = Q.mastered.has(q.id);
        return { q, wrongN, done, tries: wrongN + (done ? 1 : 0) };
      }).sort((a, b) => b.wrongN - a.wrongN);
      const oneShot = rows.filter((r) => r.done && r.wrongN === 0).length;
      document.getElementById("r-count-sub").textContent =
        `一次就答對 ${oneShot} 題，答錯後重練才答對 ${rows.filter((r) => r.done && r.wrongN > 0).length} 題`
        + (rows.some((r) => !r.done) ? `，尚未攻克 ${rows.filter((r) => !r.done).length} 題` : "");
      document.getElementById("r-count").innerHTML = `
        <thead><tr><th>題目</th><th>答案</th><th style="text-align:right;">作答次數</th></tr></thead>
        <tbody>${rows.map((r) => `
          <tr>
            <td class="code">${esc(r.q.prompt)}</td>
            <td>${esc(codeAnswerText(r.q))}</td>
            <td style="text-align:right;white-space:nowrap;">
              ${r.done ? `${r.tries} 次` : `<span style="color:#9CA3AF;">未攻克</span>`}
              ${r.wrongN ? `<span class="wrong-pill">錯 ${r.wrongN}</span>` : ""}
            </td>
          </tr>`).join("")}
        </tbody>`;
    }
    document.getElementById("r-score").textContent = `${correct} / ${total}`;
    const pctEl = document.getElementById("r-pct");
    pctEl.textContent = `${pct}%`;
    pctEl.style.color = pct >= 90 ? "#059669" : pct >= 70 ? "#D97706" : "#DC2626";

    const reviewQs = answered.filter((q) => Q.wrongAnswers.has(q.id))
      .sort((a, b) => (Q.wrongCount.get(b.id) || 0) - (Q.wrongCount.get(a.id) || 0));
    document.getElementById("r-wrong-card").style.display = reviewQs.length ? "block" : "none";
    document.getElementById("btn-retry-wrong").style.display = wrong.length ? "inline-flex" : "none";
    document.getElementById("r-wrong").innerHTML = reviewQs.map((q) => {
      const yours = Q.wrongAnswers.get(q.id);
      return `<div class="row">
        <div class="q">${esc(q.prompt)}</div>
        <div style="flex:1;">
          <span class="right">${esc(codeAnswerText(q))}</span>
          ${yours.map((y) => ` <span class="you">${esc(y)}</span>`).join("")}
          <div class="mn">${esc(q.items.map((it) => it.mnemonic).join("；"))}</div>
        </div></div>`;
    }).join("");
    showView("result");

    const saveEl = document.getElementById("r-save");
    if (Q.saved || !total) return;
    Q.saved = true;
    saveEl.textContent = "儲存紀錄中…";
    try {
      await saveSession(user.id, CODES_TOPIC, Q.cats, total, correct, answered.map((q) => {
        const f = Q.first.get(q.id);
        return {
          question_id: q.id,
          topic: CODES_TOPIC,
          unit: q.unit,
          is_correct: f.ok,
          user_answer: f.answer ? f.answer.slice(0, 200) : "（不會，看答案）",  // 欄位為 NOT NULL
          correct_answer: codeAnswerText(q),
        };
      }));
      saveEl.textContent = "✓ 已存入紀錄";
    } catch (e) {
      Q.saved = false;
      saveEl.textContent = "⚠ 紀錄儲存失敗（" + e.message + "）";
    }
  }

  document.getElementById("btn-retry-wrong").addEventListener("click", () => {
    startQuiz(shuffle(Q.lastWrong), true, Q.cats);
  });

  window.addEventListener("beforeunload", (e) => {
    if (Q && !Q.saved && Q.first.size && document.getElementById("view-quiz").style.display !== "none") {
      e.preventDefault(); e.returnValue = "";
    }
  });

  // ══════════ Flash cards ══════════
  let F = null;
  function startFlash(qs) {
    F = { queue: [...qs], total: qs.length, known: 0, cur: null, flipped: false };
    showView("flash");
    nextFlash();
  }
  function nextFlash() {
    if (!F.queue.length) {
      showToast(`記憶卡完成！共 ${F.total} 張 👏`);
      showView("setup");
      return;
    }
    F.cur = F.queue.shift();
    F.flipped = false;
    const q = F.cur;
    document.getElementById("f-dir").textContent = q.dir === "c2z" ? "代碼 → 中文" : "中文 → 代碼";
    document.getElementById("f-cat").textContent = q.unit + (q.items.some((it) => it.company) ? "　★ 產品線" : "");
    const front = document.getElementById("f-front");
    front.textContent = q.prompt;
    front.className = "prompt-main" + (q.dir === "c2z" ? "" : " zh");
    document.getElementById("f-back").style.display = "none";
    document.getElementById("f-tap").style.display = "block";
    document.getElementById("flash-actions").style.display = "none";
    document.getElementById("flash-left").innerHTML = `記住 <b>${F.known}</b> / ${F.total}`;
    document.getElementById("flash-right").innerHTML = `剩 <b>${F.queue.length + 1}</b> 張`;
    document.getElementById("flash-progress").style.width = `${(F.known / F.total) * 100}%`;
  }
  function flip() {
    if (!F || F.flipped) return;
    F.flipped = true;
    const q = F.cur;
    const back = document.getElementById("f-back");
    back.innerHTML = `<div class="ans">${esc(codeAnswerText(q))}</div>
      <div class="mn">💡 ${q.items.map((it) => (q.items.length > 1 ? `<b>${esc(it.code)}</b>：` : "") + esc(it.mnemonic)).join("<br>")}</div>
      ${prodTag(q)}`;
    back.style.display = "block";
    document.getElementById("f-tap").style.display = "none";
    document.getElementById("flash-actions").style.display = "flex";
  }
  function rateFlash(knew) {
    if (!F || !F.flipped) return;
    if (knew) F.known++;
    else F.queue.splice(Math.min(5, F.queue.length), 0, F.cur);
    nextFlash();
  }
  document.getElementById("flash-card").addEventListener("click", flip);
  document.getElementById("btn-know").addEventListener("click", () => rateFlash(true));
  document.getElementById("btn-again").addEventListener("click", () => rateFlash(false));
  document.addEventListener("keydown", (e) => {
    if (document.getElementById("view-flash").style.display === "none") return;
    if (e.key === " ") { e.preventDefault(); flip(); }
    else if (e.key === "k" || e.key === "K" || e.key === "ArrowRight") rateFlash(true);
    else if (e.key === "j" || e.key === "J" || e.key === "ArrowLeft") rateFlash(false);
  });
</script>
